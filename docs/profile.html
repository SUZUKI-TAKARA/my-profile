<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <title>ポートフォリオ</title>

  <!-- Splide CSS（自分のCSSより前に読み込む） -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 w-full bg-yellow-50 transition-all">

  <header class="fixed top-0 left-0 border-b z-50 bg-yellow-200 text-center w-full flex justify-between items-center">
    <div class="font-bold text-5xl mt-3 mb-3 ml-8">たかぴー</div>
    <div class="font-bold text-xl mt-3 mb-3 mr-8">#ディズニー好き #山梨出身</div>
  </header>
  <h1 class="font-bold text-5xl text-center mt-32">プロフィール</h1>
  <main class="mt-10 grid grid-cols-2 gap-20 max-w-4xl mx-auto">
    <div class=" w-80 h-80 shadow rounded-lg  m-5 pt-5 px-3 pb-3 bg-white frex items-center justify-center hover:scale-105 duration-300">
      <h1 class="text-3xl font-bold">鈴木 宝蔵</h1>
      <p class="font-bold mt-4 p-1">出身：山梨県</p>
      <p class="font-bold p-1">在籍：明治大学 商学部 １年生</p>
      <p class="font-bold p-1">趣味：ディズニーの動画鑑賞</p>
      <p class="font-bold p-1">あだ名：小学生時代に謎にたかピーマンと呼ばれていた。いまはたかぴー。</p>
      <p class="font-bold p-1">一言：みんな、楽しもうや。</p>
    </div>
    <div class=" w-80 h-80 shadow rounded-lg m-5 pt-5 px-3 pb-3 bg-white frex items-center justify-center hover:scale-105 duration-300">
      <h1 class="text-3xl font-bold">スキル集</h1>
      <p class="font-bold mt-4 p-1">・パディングを巧みに使いこなす。</p>
      <p class="font-bold p-1">・グリッドなどの記憶は少しあいまい。</p>
      <p class="font-bold p-1">・アロー関数は少しだけ使える。</p>
      <p class="font-bold p-1">・フレックスで整えがち。</p>
      <p class="font-bold p-1">・カードタイプ作りがち。</p>
      <p class="font-bold p-1">・簡素なデザイン。</p>
    </div>
    
    
  </main>
    <section class="splide" aria-label="作品スライダー">
      <h1 class="font-bold text-5xl text-center mt-20">過去の作品</h1>
      <div class="splide__track mb-5">

        <ul class="splide__list">
          <li class="splide__slide flex justify-center items-centern p-10 w-96 h-96">
            <img src="../docs/img/アボカドトースト３.jpg" alt="アボカドトースト">
          </li>
          <li class="splide__slide flex justify-center items-centern p-10 w-96 h-96">
            <img src="../docs/img/クロックムッシュ３.jpg" alt="クロックムッシュ">
          </li>
          <li class="splide__slide flex justify-center items-centern p-10 w-96 h-96">
            <img src="../docs/img/食堂ロゴ.jpg" alt="食堂ロゴです">
          </li>
    
        </ul>
      </div>
    </section>
  </main>
  
  
  
  
  
  
  
  <footer class="bg-gray-700 text-white px-6 py-8">
    <div class="max-w-4xl mx-auto flex items-center justify-center">POSSE③</div>
  </footer>
</section>
<script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"></script>
<script src="./js/main.js"></script>
<script>// js/main.js
new Splide('.splide').mount();</script>
