<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Profile Viewer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 px-5 py-12 text-slate-800">
  <main class="mx-auto max-w-2xl">
    <header class="mb-8 text-center">
      <p class="mb-2 text-sm font-semibold tracking-widest text-indigo-600">POSSE WEEK 10</p>
      <h1 class="text-3xl font-bold">GitHub Profile Viewer</h1>
      <p class="mt-3 text-slate-600">GitHubユーザー名を入力して、プロフィールを取得します。</p>
    </header>

    <form id="searchForm" class="mb-6 flex gap-2" novalidate>
      <label for="username" class="sr-only">GitHubユーザー名</label>
      <input id="username" name="username" type="text" value="octocat" autocomplete="off"
        placeholder="例: octocat"
        class="min-w-0 flex-1 rounded-lg border border-slate-300 bg-white px-4 py-3 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200">
      <button type="submit" class="rounded-lg bg-indigo-600 px-5 py-3 font-semibold text-white transition hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-300 disabled:cursor-not-allowed disabled:bg-indigo-300">
        検索
      </button>
    </form>

    <p id="status" class="mb-4 min-h-6 text-center text-sm" aria-live="polite"></p>

    <section id="profile" class="hidden rounded-2xl border border-slate-200 bg-white p-6 shadow-sm" aria-live="polite">
      <div class="flex flex-col items-center gap-5 sm:flex-row sm:items-start">
        <img id="avatar" class="h-28 w-28 rounded-full border-4 border-slate-100 object-cover" alt="">
        <div class="min-w-0 text-center sm:text-left">
          <h2 id="name" class="break-words text-2xl font-bold"></h2>
          <a id="login" class="mt-1 inline-block text-indigo-600 hover:underline" target="_blank" rel="noopener noreferrer"></a>
          <p id="bio" class="mt-4 whitespace-pre-wrap text-slate-600"></p>
          <p class="mt-5 text-sm text-slate-500"><span id="followers" class="font-bold text-slate-800"></span> followers</p>
        </div>
      </div>
    </section>
  </main>

  <script>
    const form = document.querySelector('#searchForm');
    const usernameInput = document.querySelector('#username');
    const submitButton = form.querySelector('button');
    const status = document.querySelector('#status');
    const profile = document.querySelector('#profile');

    function setStatus(message, type = 'normal') {
      status.textContent = message;
      status.className = `mb-4 min-h-6 text-center text-sm ${type === 'error' ? 'text-red-600' : 'text-slate-500'}`;
    }

    async function loadProfile(username) {
      profile.classList.add('hidden');
      submitButton.disabled = true;
      setStatus('プロフィールを取得中です…');

      try {
        const response = await fetch(`https://api.github.com/users/${encodeURIComponent(username)}`);

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const user = await response.json();
        console.log('取得したGitHubプロフィール:', user);

        const displayName = user.name || user.login;
        document.querySelector('#avatar').src = user.avatar_url;
        document.querySelector('#avatar').alt = `${displayName}のアバター`;
        document.querySelector('#name').textContent = displayName;
        document.querySelector('#login').textContent = `@${user.login}`;
        document.querySelector('#login').href = user.html_url;
        document.querySelector('#bio').textContent = user.bio || '自己紹介は登録されていません。';
        document.querySelector('#followers').textContent = user.followers.toLocaleString();

        profile.classList.remove('hidden');
        setStatus('プロフィールを取得しました。');
      } catch (error) {
        console.error('GitHubプロフィールの取得に失敗しました:', error);
        setStatus('取得に失敗しました。ユーザー名や通信状況を確認して、もう一度お試しください。', 'error');
      } finally {
        submitButton.disabled = false;
      }
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const username = usernameInput.value.trim();

      if (!username) {
        profile.classList.add('hidden');
        setStatus('GitHubユーザー名を入力してください。', 'error');
        usernameInput.focus();
        return;
      }

      loadProfile(username);
    });

    loadProfile(usernameInput.value);
  </script>
</body>
</html>
