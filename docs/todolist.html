<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex justify-center items-center" style="font-family: 'Poppins', sans-serif;">
    <div class="max-w-5xl w-full shadow rounded bg-gray-200"> 
        <h1 class="text-center font-bold text-3xl mt-5 bg-green-500 mx-40 rounded-lg p-2">TO DO リスト</h1>

        <div class="grid grid-cols-2">
            <ul  id="todoList" class="shadow rounded-lg max-w-2xl my-6 mx-2 py-3 px-2 bg-white"></ul>
            
            <div class="flex flex-col my-6 mx-2 max-w-2xl">
                <input id="todoInput" type="text" placeholder="タスクを追加" class="text-center rounded-lg shadow py-3">
                <button id="addBtn" class="rounded-lg mt-3 shadow bg-gray-400 py-3 font-bold">追加</button>
            </div>
        </div>
    </div>

    <script>
    const addButton = document.querySelector("#addBtn");
    const todoInput = document.querySelector("#todoInput");
    const todoList  = document.querySelector("#todoList");

    addButton.addEventListener("click", () => {
        const text = todoInput.value;
        
        if(text === ""){
            return;
        }

        const item = document.createElement("li");
        item.className = "flex items-center justify-between bg-gray-50 rounded px-3 py-2 mt-2";

        const span = document.createElement("span");
        span.textContent = text;

        const doneBtn = document.createElement("button");
        doneBtn.textContent = "完了";
        doneBtn.className = "text-sm text-gray-500 hover:text-red-500";

        doneBtn.addEventListener("click", () => {
            span.classList.toggle("line-through");
            span.classList.toggle("text-gray-400");
        });

        item.appendChild(span);
        item.appendChild(doneBtn);
        todoList.appendChild(item);

        todoInput.value = "";
    })
    
    
    
    
    
    
    
    
    </script>
    
</body>
</html>
